<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlphaStudios Admin</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dymdijw7n/image/upload/v1773648385/Black_and_Red_Modern_Initials_A_E-Sport_Gaming_Pictorial_Mark_Logo_hx5o3z.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --green-primary: #1a1a2e;
            --green-dark: #0f0f1a;
            --green-glow: rgba(26, 26, 46, 0.2);
            --bg-primary: #ffffff;
            --bg-card: #ffffff;
            --white: #1a1a2e;
            --white-70: rgba(26,26,46,0.65);
            --white-50: rgba(26,26,46,0.5);
            --white-30: rgba(26,26,46,0.3);
            --white-15: rgba(26,26,46,0.12);
            --white-10: rgba(26,26,46,0.08);
            --white-05: rgba(26,26,46,0.04);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--white);
            min-height: 100vh;
            padding: 20px;
        }
        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0;
            border-bottom: 1px solid var(--white-10);
            margin-bottom: 30px;
        }
        .admin-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .admin-header h1 img { height: 40px; }
        .admin-header .admin-user {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--white-70);
            font-size: 0.85rem;
        }
        .admin-header .admin-user img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }
        .admin-login {
            text-align: center;
            padding: 100px 20px;
        }
        .admin-login h2 { margin-bottom: 16px; }
        .admin-login p { color: var(--white-50); margin-bottom: 24px; }
        .admin-login-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 28px;
            background: var(--green-primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }
        .admin-stat {
            background: var(--bg-card);
            border: 1px solid var(--white-10);
            border-radius: 12px;
            padding: 20px;
        }
        .admin-stat-label { font-size: 0.75rem; color: var(--white-50); text-transform: uppercase; letter-spacing: 1px; }
        .admin-stat-value { font-size: 1.8rem; font-weight: 700; color: var(--green-primary); margin-top: 4px; }
        .admin-table-wrap {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--white-10);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        th {
            text-align: left;
            padding: 14px 16px;
            background: var(--bg-card);
            color: var(--white-50);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        td {
            padding: 14px 16px;
            border-top: 1px solid var(--white-05);
            vertical-align: middle;
        }
        tr:hover td { background: rgba(26,26,46,0.03); }
        .order-track {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .order-track img {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            object-fit: cover;
        }
        .order-track-title { font-weight: 600; }
        .order-track-artist { color: var(--white-50); font-size: 0.8rem; }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-in_progress {
            background: rgba(26,26,46,0.08);
            color: var(--white-50);
        }
        .status-completed {
            background: rgba(0, 230, 118, 0.15);
            color: var(--green-primary);
        }
        .admin-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .admin-btn {
            padding: 6px 14px;
            border: 1px solid var(--white-15);
            border-radius: 6px;
            background: none;
            color: var(--white-70);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .admin-btn:hover {
            background: var(--white-10);
            border-color: var(--green-primary);
            color: var(--white);
        }
        .admin-btn.btn-green {
            background: var(--green-primary);
            color: #ffffff;
            border-color: var(--green-primary);
            font-weight: 600;
        }
        .admin-btn.btn-green:hover {
            background: var(--green-dark);
        }
        .admin-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        input[type="file"] { display: none; }
        .admin-feedback-cell { min-width: 200px; }
        .admin-feedback-input {
            width: 100%;
            min-height: 60px;
            padding: 8px 10px;
            background: var(--white-05);
            border: 1px solid var(--white-15);
            border-radius: 6px;
            color: var(--white);
            font-family: inherit;
            font-size: 0.8rem;
            resize: vertical;
        }
        .admin-feedback-input::placeholder { color: var(--white-30); }
        .admin-feedback-input:focus { outline: none; border-color: var(--green-primary); }
        /* Admin pipeline stepper (inline) */
        .admin-pipeline {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 6px;
        }
        .admin-pipeline-step {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--white-20);
            letter-spacing: 0.2px;
        }
        .admin-pipeline-step.done { color: var(--green-primary); }
        .admin-pipeline-step.active { color: var(--green-primary); }
        .admin-pipeline-dot {
            width: 16px; height: 16px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.55rem; font-weight: 700;
            border: 1.5px solid var(--white-15);
            background: transparent;
            color: var(--white-20);
        }
        .admin-pipeline-step.active .admin-pipeline-dot {
            border-color: var(--green-primary);
            background: var(--green-10);
            color: var(--green-primary);
        }
        .admin-pipeline-step.done .admin-pipeline-dot {
            border-color: var(--green-primary);
            background: var(--green-primary);
            color: #fff;
        }
        .admin-pipeline-sep {
            width: 12px; height: 1.5px;
            background: var(--white-10);
            flex-shrink: 0;
        }
        .admin-pipeline-step.done + .admin-pipeline-sep,
        .admin-pipeline-sep.filled { background: var(--green-primary); }
        .admin-versions {
            display: flex; flex-direction: column; gap: 4px;
        }
        .admin-version-link {
            display: inline-block; padding: 3px 10px; border-radius: 6px;
            font-size: 0.7rem; font-weight: 500; text-decoration: none;
            background: var(--white-05); color: var(--white-50);
            border: 1px solid var(--white-10); transition: all 0.2s;
        }
        .admin-version-link:hover {
            background: var(--white-10); color: var(--white);
        }
        .admin-version-link.latest {
            background: rgba(0,168,84,0.08); color: var(--green-primary);
            border-color: rgba(0,168,84,0.2); font-weight: 600;
        }
        .badge-mastering {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 10px; border-radius: 20px; font-size: 0.7rem;
            font-weight: 600; background: rgba(76,175,80,0.12); color: #4CAF50;
            margin-top: 4px;
        }
        .badge-sub {
            display: inline-block; padding: 2px 8px; border-radius: 12px;
            font-size: 0.65rem; font-weight: 700; margin-top: 3px;
        }
        .badge-trial { background: rgba(33,150,243,0.15); color: #2196F3; }
        .badge-paid { background: rgba(76,175,80,0.15); color: #4CAF50; }
        .badge-none { background: rgba(255,82,82,0.12); color: #ff5252; }
        .badge-reupload {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 10px; border-radius: 20px; font-size: 0.7rem;
            font-weight: 600; background: rgba(255,152,0,0.12); color: #ff9800;
            margin-top: 4px;
        }
        .admin-loading {
            text-align: center;
            padding: 60px;
            color: var(--white-50);
        }
        .admin-error {
            text-align: center;
            padding: 60px;
            color: #ff5252;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @media (max-width: 768px) {
            body { padding: 10px; }
            .admin-header h1 { font-size: 1.1rem; }
            th, td { padding: 10px 8px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div id="adminApp">
        <div class="admin-login" id="adminLogin">
            <h2>AlphaStudios Admin Panel</h2>
            <p id="adminLoginMsg">Checking session...</p>
            <a href="/" class="admin-login-btn" id="adminGoLogin" style="display:none;text-decoration:none;">Go to main site to sign in</a>
        </div>

        <div id="adminPanel" style="display:none;">
            <div class="admin-header">
                <h1>
                    <img src="https://res.cloudinary.com/dymdijw7n/image/upload/v1773648385/Black_and_Red_Modern_Initials_A_E-Sport_Gaming_Pictorial_Mark_Logo_hx5o3z.png" alt="">
                    AlphaStudios Admin
                </h1>
                <div class="admin-user">
                    <span id="adminUserName"></span>
                    <img id="adminUserAvatar" src="" alt="">
                </div>
            </div>

            <div class="admin-stats" id="adminStats"></div>

            <div class="admin-table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Track</th>
                            <th>Original File</th>
                            <th>Customer</th>
                            <th>Status</th>
                            <th>Mastered File</th>
                            <th>Feedback</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminOrdersBody">
                        <tr><td colspan="8" class="admin-loading">Loading orders...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="supabase.js"></script>
    <script>
        const ADMIN_SUPABASE_URL = BeatpushAuth.supabaseUrl;
        const ADMIN_SUPABASE_KEY = BeatpushAuth.supabaseKey;

        // Init - detect existing session
        (async function() {
            const msg = document.getElementById('adminLoginMsg');
            const token = localStorage.getItem('alphastudios_access_token');

            if (!token) {
                msg.textContent = 'No session found. Sign in on the main site first.';
                document.getElementById('adminGoLogin').style.display = 'inline-flex';
                return;
            }

            msg.textContent = 'Session found, verifying...';

            let user = null;
            try {
                const res = await fetch(`${ADMIN_SUPABASE_URL}/auth/v1/user`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'apikey': ADMIN_SUPABASE_KEY,
                    },
                });
                if (res.ok) {
                    user = await res.json();
                } else {
                    msg.textContent = 'Session expired. Sign in again on the main site.';
                    document.getElementById('adminGoLogin').style.display = 'inline-flex';
                    return;
                }
            } catch (e) {
                msg.textContent = 'Network error: ' + e.message;
                document.getElementById('adminGoLogin').style.display = 'inline-flex';
                return;
            }

            if (user) {
                checkAndShowAdmin(user);
            } else {
                msg.textContent = 'Could not verify session. Sign in again on the main site.';
                document.getElementById('adminGoLogin').style.display = 'inline-flex';
            }
        })();

        async function checkAndShowAdmin(user) {
            const meta = user.user_metadata || {};
            document.getElementById('adminUserName').textContent = meta.full_name || user.email;
            document.getElementById('adminUserAvatar').src = meta.avatar_url || '';

            // Fetch orders via admin API
            const token = BeatpushAuth.getToken();
            try {
                const res = await fetch('/api/admin/orders', {
                    headers: { 'Authorization': `Bearer ${token}` },
                });
                if (res.status === 403) {
                    document.getElementById('adminLogin').innerHTML = '<div class="admin-error"><h2>Access Denied</h2><p>Your account is not an admin.</p></div>';
                    return;
                }
                if (!res.ok) throw new Error('Failed to load');

                const orders = await res.json();
                document.getElementById('adminLogin').style.display = 'none';
                document.getElementById('adminPanel').style.display = '';
                renderStats(orders);
                renderOrders(orders);
            } catch (e) {
                document.getElementById('adminLogin').innerHTML = `<div class="admin-error"><h2>Error</h2><p>${e.message}</p></div>`;
            }
        }

        function renderStats(orders) {
            const total = orders.length;
            const completed = orders.filter(o => o.order_status === 'completed').length;
            const inProgress = orders.filter(o => o.order_status === 'in_progress').length;
            const revenue = orders.reduce((sum, o) => sum + (o.amount || 0), 0);

            document.getElementById('adminStats').innerHTML = `
                <div class="admin-stat"><div class="admin-stat-label">Total Orders</div><div class="admin-stat-value">${total}</div></div>
                <div class="admin-stat"><div class="admin-stat-label">In Progress</div><div class="admin-stat-value">${inProgress}</div></div>
                <div class="admin-stat"><div class="admin-stat-label">Completed</div><div class="admin-stat-value">${completed}</div></div>
                <div class="admin-stat"><div class="admin-stat-label">Revenue</div><div class="admin-stat-value">$${(revenue / 100).toLocaleString()}</div></div>
            `;
        }

        function renderOrders(orders) {
            const tbody = document.getElementById('adminOrdersBody');
            if (!orders.length) {
                tbody.innerHTML = '<tr><td colspan="10" class="admin-loading">No orders yet.</td></tr>';
                return;
            }

            tbody.innerHTML = orders.map(order => {
                const packLabel = order.pack === 'mastering' ? 'Mastering + Feedback + Labels' : order.pack;
                const statusClass = `status-${order.order_status}`;
                const statusText = order.order_status === 'completed' ? 'Completed' : 'In Progress';
                const hasReceipt = !!order.receipt_url;

                const subStatus = order.subscription_status || 'none';
                const isTrial = subStatus === 'trialing';
                const isPaid = subStatus === 'active';
                const subBadge = isTrial ? '<span class="badge-sub badge-trial">Trial</span>'
                    : isPaid ? '<span class="badge-sub badge-paid">Paid</span>'
                    : `<span class="badge-sub badge-none">${esc(subStatus)}</span>`;

                return `<tr data-order-id="${order.id}">
                    <td>${new Date(order.created_at).toLocaleDateString()}</td>
                    <td>
                        <div class="order-track">
                            ${order.track_artwork ? `<img src="${esc(order.track_artwork)}" alt="" onerror="this.style.display='none'">` : ''}
                            <div>
                                <div class="order-track-title">${esc(order.track_title || '-')}</div>
                                <div class="order-track-artist">${esc(order.track_artist || '-')}</div>
                                ${subBadge}
                                ${order.reupload_count ? `<div class="badge-reupload">Re-upload ${order.reupload_count}/3</div>` : ''}
                            </div>
                        </div>
                    </td>
                    <td>${(() => {
                        const versions = Array.isArray(order.track_versions) && order.track_versions.length ? order.track_versions : (order.track_url ? [{ url: order.track_url, label: 'Original' }] : []);
                        if (!versions.length) return '<span style="color:var(--white-30)">No file</span>';
                        return '<div class="admin-versions">' + versions.map((v, i) =>
                            `<a href="${esc(v.url)}" target="_blank" class="admin-version-link${i === versions.length - 1 ? ' latest' : ''}" title="${v.date ? new Date(v.date).toLocaleString() : ''}">${esc(v.label || ('Upload ' + (i+1)))}</a>`
                        ).join('') + '</div>';
                    })()}</td>
                    <td>${esc(order.customer_email || '-')}</td>
                    <td>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                        ${order.mastering_approved ? '<div class="badge-mastering"><strong>Approved For Mastering</strong></div>' : ''}
                        ${(() => {
                            let step = 1;
                            if (order.order_status === 'completed') step = 3;
                            else if (order.mastering_approved) step = 2;
                            const sc = (n) => step > n ? 'done' : step === n ? 'active' : '';
                            const dc = (n) => step > n ? '<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : n;
                            return `<div class="admin-pipeline">
                                <div class="admin-pipeline-step ${sc(1)}"><div class="admin-pipeline-dot">${dc(1)}</div>Feedbacks</div>
                                <div class="admin-pipeline-sep${step >= 2 ? ' filled' : ''}"></div>
                                <div class="admin-pipeline-step ${sc(2)}"><div class="admin-pipeline-dot">${dc(2)}</div>Mastering</div>
                                <div class="admin-pipeline-sep${step >= 3 ? ' filled' : ''}"></div>
                                <div class="admin-pipeline-step ${sc(3)}"><div class="admin-pipeline-dot">${dc(3)}</div>Labels</div>
                            </div>`;
                        })()}
                    </td>
                    <td>${hasReceipt ? `<a href="${esc(order.receipt_url)}" target="_blank" class="admin-btn" style="text-decoration:none;">Download</a>` : '<span style="color:var(--white-30)">-</span>'}</td>
                    <td>
                        <div class="admin-feedback-cell">
                            <textarea class="admin-feedback-input" id="feedback-${order.id}" placeholder="Write feedback...">${esc(order.feedback || '')}</textarea>
                            <button class="admin-btn" onclick="saveFeedback('${order.id}')" style="margin-top:4px;width:100%;">Send Feedback</button>
                        </div>
                    </td>
                    <td>
                        <div class="admin-actions">
                            ${order.order_status === 'in_progress' ? `<button class="admin-btn btn-green" onclick="toggleStatus('${order.id}', 'completed')">Mark Complete</button>` : `<button class="admin-btn" onclick="toggleStatus('${order.id}', 'in_progress')">Mark In Progress</button>`}
                            ${isPaid ? `<label class="admin-btn">
                                Upload Audio
                                <input type="file" accept="audio/*,.wav,.mp3,.flac,.aiff,.aif" onchange="uploadMasteredFile('${order.id}', this)">
                            </label>` : `<span class="admin-btn" style="opacity:0.4;cursor:not-allowed;" title="Mastering only for paid subscribers">Upload Audio</span>`}
                        </div>
                    </td>
                </tr>`;
            }).join('');
        }

        async function saveFeedback(orderId) {
            const textarea = document.getElementById(`feedback-${orderId}`);
            const feedbackText = textarea ? textarea.value.trim() : '';
            if (!feedbackText) {
                showNotification('Please write some feedback first.', 'warning');
                return;
            }

            const token = BeatpushAuth.getToken();
            try {
                // Save feedback to order
                const res = await fetch('/api/admin/orders', {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                    },
                    body: JSON.stringify({ order_id: orderId, feedback: feedbackText }),
                });
                if (!res.ok) throw new Error('Failed to save feedback');

                // Send email notification
                try {
                    const emailRes = await fetch('/api/admin/send-receipt-email', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`,
                        },
                        body: JSON.stringify({ order_id: orderId, type: 'feedback' }),
                    });
                    const emailData = await emailRes.json();
                    if (emailRes.ok) {
                        showNotification(`Feedback saved & email sent to ${emailData.sent_to}`, 'success');
                    } else {
                        showNotification(`Feedback saved but email failed: ${emailData.error}`, 'warning');
                    }
                } catch (emailErr) {
                    showNotification('Feedback saved but email notification failed', 'warning');
                }

                // Reload
                const listRes = await fetch('/api/admin/orders', { headers: { 'Authorization': `Bearer ${token}` } });
                const orders = await listRes.json();
                renderStats(orders);
                renderOrders(orders);
            } catch (e) {
                alert('Failed to save feedback: ' + e.message);
            }
        }

        async function toggleStatus(orderId, newStatus) {
            const token = BeatpushAuth.getToken();
            try {
                const res = await fetch('/api/admin/orders', {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                    },
                    body: JSON.stringify({ order_id: orderId, order_status: newStatus }),
                });
                if (res.ok) {
                    // Reload
                    const listRes = await fetch('/api/admin/orders', { headers: { 'Authorization': `Bearer ${token}` } });
                    const orders = await listRes.json();
                    renderStats(orders);
                    renderOrders(orders);
                }
            } catch (e) {
                alert('Failed to update status: ' + e.message);
            }
        }

        async function uploadMasteredFile(orderId, input) {
            const file = input.files[0];
            if (!file) return;

            const token = BeatpushAuth.getToken();
            try {
                // Step 1: Get signed upload URL from our API
                const urlRes = await fetch('/api/admin/upload-receipt', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                    },
                    body: JSON.stringify({ action: 'get-upload-url', order_id: orderId, file_name: file.name }),
                });
                if (!urlRes.ok) {
                    const err = await urlRes.json();
                    alert('Upload failed: ' + (err.details || err.error));
                    input.value = '';
                    return;
                }
                const { uploadUrl, publicUrl } = await urlRes.json();

                // Step 2: Upload file directly to Supabase Storage via signed URL
                const putRes = await fetch(uploadUrl, {
                    method: 'PUT',
                    headers: { 'Content-Type': file.type || 'audio/wav' },
                    body: file,
                });
                if (!putRes.ok) {
                    const errText = await putRes.text();
                    alert('Upload to storage failed: ' + errText);
                    input.value = '';
                    return;
                }

                // Step 3: Confirm upload - update order with receipt URL
                const confirmRes = await fetch('/api/admin/upload-receipt', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                    },
                    body: JSON.stringify({ action: 'confirm-upload', order_id: orderId, receipt_url: publicUrl }),
                });
                if (!confirmRes.ok) {
                    const err = await confirmRes.json();
                    alert('Failed to update order: ' + (err.details || err.error));
                    input.value = '';
                    return;
                }

                // Step 4: Auto-send email notification to customer
                try {
                    const emailRes = await fetch('/api/admin/send-receipt-email', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`,
                        },
                        body: JSON.stringify({ order_id: orderId }),
                    });
                    const emailData = await emailRes.json();
                    if (emailRes.ok) {
                        showNotification(`Audio uploaded & email sent to ${emailData.sent_to}`, 'success');
                    } else {
                        showNotification(`Audio uploaded but email failed: ${emailData.error}`, 'warning');
                    }
                } catch (emailErr) {
                    showNotification('Audio uploaded but email notification failed', 'warning');
                }

                // Reload orders
                const listRes = await fetch('/api/admin/orders', { headers: { 'Authorization': `Bearer ${token}` } });
                const orders = await listRes.json();
                renderStats(orders);
                renderOrders(orders);
            } catch (e) {
                alert('Upload failed: ' + e.message);
            }
            input.value = '';
        }

        function showNotification(message, type) {
            const notif = document.createElement('div');
            notif.style.cssText = `
                position: fixed; top: 20px; right: 20px; z-index: 9999;
                padding: 14px 24px; border-radius: 10px; font-size: 0.9rem;
                font-weight: 500; max-width: 400px; animation: slideIn 0.3s ease;
                ${type === 'success'
                    ? 'background: rgba(0,230,118,0.15); border: 1px solid rgba(0,230,118,0.3); color: #00e676;'
                    : 'background: rgba(255,193,7,0.15); border: 1px solid rgba(255,193,7,0.3); color: #ffc107;'}
            `;
            notif.textContent = message;
            document.body.appendChild(notif);
            setTimeout(() => { notif.style.opacity = '0'; notif.style.transition = 'opacity 0.3s'; }, 4000);
            setTimeout(() => notif.remove(), 4500);
        }

        function esc(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
